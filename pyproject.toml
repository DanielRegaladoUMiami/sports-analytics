[project]
name = "sports-analytics"
version = "0.1.0"
description = "EDA de NFL y LaLiga con enfoque de casa de apuestas: mercado como benchmark, números clave, sesgo favorito-longshot, señal contra ruido y Dixon-Coles."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Regalado" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "requests>=2.31",
    "jupyterlab>=4.0",
]

[tool.uv]
package = false
